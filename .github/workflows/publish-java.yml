name: Publish Java SDK

# Publishes java/ to Maven Central via the Sonatype Central portal.
# One-time setup required (namespace verification, GPG key, GitHub secrets) —
# see RELEASING.md.
#
# Release: bump <version> in java/pom.xml, then push a matching tag,
# e.g. java-v0.1.0.

on:
  push:
    tags:
      - 'java-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Run tests
        run: mvn -B test

      - name: Check tag matches pom version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#java-v}"
          POM_VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match pom.xml version ($POM_VERSION)" >&2
            exit 1
          fi

      - name: Publish to Maven Central
        run: mvn -B -P release -DskipTests deploy
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
