[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ollang-sdk"
version = "0.2.0"
description = "Official Python SDK for the Ollang API - Translation, Transcription, Dubbing, Closed Captioning, and I18n Management"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ollang" }]
requires-python = ">=3.8"
dependencies = ["requests>=2.25.0"]
keywords = [
    "ollang",
    "translation",
    "transcription",
    "dubbing",
    "closed-captioning",
    "subtitles",
    "localization",
    "sdk",
    "api",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/ollang/sdk"
Documentation = "https://api-docs.ollang.com"
Repository = "https://github.com/ollang/sdk"
"Bug Tracker" = "https://github.com/ollang/sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]
