name: Java & Python SDK Tests

on:
  push:
    branches:
      - main
    paths:
      - 'java/**'
      - 'python/**'
      - '.github/workflows/ci-libs.yml'
  pull_request:
    paths:
      - 'java/**'
      - 'python/**'
      - '.github/workflows/ci-libs.yml'

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: pip install .

      - name: Run tests
        run: python -m unittest discover tests -v

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Check release artifacts build
        run: mvn -B -P release -DskipTests -Dgpg.skip=true verify
